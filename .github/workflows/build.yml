name: Feed bauen

on:
  push:
    branches: [main]
    paths:
      - "episodes/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TTS_MODEL: ${{ vars.TTS_MODEL || 'gemini-3.8-flash-tts' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'Charon' }}
      TTS_STYLE: ${{ vars.TTS_STYLE || 'ruhig, sachlich, wie ein Morgen-Nachrichtensprecher' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KEEP_DAYS: "30"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          pip install pyyaml piper-tts
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - id: pages
        uses: actions/configure-pages@v6

      - name: Folgen vertonen und Feed bauen
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Eigener Job: bei Fehlern einzeln wiederholbar, ohne erneut zu vertonen.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
